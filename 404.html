<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Dream Come True</title>
    <script>
      // SPA-редирект для GitHub Pages: сохраняем запрошенный путь и уходим на корень,
      // index.html восстановит его через history.replaceState
      sessionStorage.redirect = location.pathname + location.search + location.hash
      location.replace('/')
    </script>
  </head>
  <body></body>
</html>
