    <script>
      (function () {
        var onGH = /(^|\.)github\.io$/.test(location.hostname);
        if (!onGH && location.pathname.indexOf('/ocean-horizon') !== 0) {
          history.replaceState(null, '', '/ocean-horizon/');
        }
        var base = onGH ? '/ocean-horizon' : '';
        var l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href = base + '/assets/index-QWLh_dx6.css';
        document.head.appendChild(l);
        var s = document.createElement('script');

    <script>
      (function () {
        var R = [
          ['Ocean Horizon', 'Dream Come True'],
          ['OCEAN HORIZON', 'DREAM COME TRUE'],
          ['Строим горизонт', 'Строим мечту']
        ];
        function fixNode(t) {
          var v = t.nodeValue, nv = v;
          for (var i = 0; i < R.length; i++) {
            if (nv.indexOf(R[i][0]) !== -1) nv = nv.split(R[i][0]).join(R[i][1]);
          }
          if (nv !== v) t.nodeValue = nv;
        }
        function walk(root) {
          if (!root) return;
          if (root.nodeType === 3) { fixNode(root); return; }
          if (root.nodeType !== 1 && root.nodeType !== 9 && root.nodeType !== 11) return;
          var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), t;
          while ((t = w.nextNode())) fixNode(t);
        }
        new MutationObserver(function (ms) {
          for (var i = 0; i < ms.length; i++) {
            var m = ms[i];
            if (m.type === 'characterData') fixNode(m.target);
            for (var j = 0; j < m.addedNodes.length; j++) walk(m.addedNodes[j]);
          }
        }).observe(document.documentElement, { childList: true, subtree: true, characterData: true });
        document.addEventListener('DOMContentLoaded', function () { walk(document.body); });
      })();
    </script>
